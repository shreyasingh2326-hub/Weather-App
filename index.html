<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEATHER APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="card">
        <div id="search-box">
        <input id ="inp" type="text" placeholder="Search City">
        <button id="btn">🔍</button>
    </div>

    <div id="time">
        <div id="clock">10:00:00</div>
    <div id="day">Monday</div>
    <div id="date">20 June 2026</div>
    </div>

    <div id="icon">🌞</div>

    <div id="info">
        <h3 id="temp">Temperature</h3>
        <h3 id="city">City</h3>
        <h3 id="cond">Condition</h3>
    </div>
    <div id="detail">
        <p id="hum">💧 Humidity</p>
        <p id="wind">🌬️ Wind</p>
    </div>
    
        
    </div>

    <script src="script.js"></script>
</body>
</html>
